<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yart Prod — Трекер</title>
<style>
  :root {
    --bg:#1a1a1a;--bg2:#222;--bg3:#2a2a2a;--bg4:#333;
    --or:#f05a1a;--or2:#d94e10;
    --tx:#fff;--txm:#999;--txd:#555;--bd:#333;
    --red:#c0392b;--reds:#2e1410;
    --yel:#cc8800;--yels:#2e2010;
    --grn:#2e7d4f;--grns:#162e1e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

  /* HEADER */
  .header{background:var(--bg2);border-bottom:1px solid var(--bd);padding:0 16px;height:52px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
  .logo-yart{font-size:17px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
  .logo-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--or);margin-left:1px;vertical-align:middle}
  .logo-prod{font-size:9px;font-weight:700;color:var(--txm);letter-spacing:2px;text-transform:uppercase}
  .header-sep{flex:1}
  .header-date{font-size:11px;color:var(--txm)}
  .header-sync{font-size:11px;color:var(--txm)}
  .header-sync.err{color:#e57373}

  /* BOARD */
  .board{display:flex;gap:12px;padding:16px;min-height:calc(100vh - 52px);align-items:flex-start;overflow-x:auto}
  .board::-webkit-scrollbar{height:4px}
  .board::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}

  /* COLUMN */
  .column{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;width:280px;min-width:280px;padding:12px;display:flex;flex-direction:column;gap:10px;flex-shrink:0}
  .col-header{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
  .avatar{border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
  .col-title-text{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;flex:1;cursor:pointer;word-break:break-word}
  .col-title-text:hover{color:var(--or)}
  .col-count{background:var(--bg4);color:var(--txm);font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;flex-shrink:0}
  .btn-col-menu{background:none;border:none;color:var(--txd);cursor:pointer;font-size:17px;padding:0 4px;line-height:1;flex-shrink:0}
  .btn-col-menu:hover{color:#fff}

  /* CARD */
  .card{background:var(--bg3);border:1px solid var(--bd);border-radius:8px;padding:12px;cursor:pointer;transition:border-color .15s,transform .1s}
  .card:hover{border-color:var(--or);transform:translateY(-1px)}
  .card-label{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .card-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .card-dot.red{background:var(--red)}.card-dot.yel{background:var(--yel)}.card-dot.or{background:var(--or)}
  .card-name{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txm)}
  .card-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:4px;font-size:10px;font-weight:700}
  .b-red{background:var(--reds);color:#e57373;border:1px solid var(--red)}
  .b-grn{background:var(--grns);color:#66bb6a;border:1px solid var(--grn)}
  .b-yel{background:var(--yels);color:#ffa726;border:1px solid var(--yel)}
  .b-def{background:var(--bg4);color:var(--txm);border:1px solid var(--bd)}
  .prog-bar{height:3px;background:var(--bg4);border-radius:2px;overflow:hidden;margin-top:9px}
  .prog-fill{height:100%;border-radius:2px;transition:width .3s}

  /* ADD CARD BTN */
  .btn-add-card{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;border:1px dashed var(--bd);color:var(--txm);font-size:12px;font-weight:600;transition:border-color .15s,background .15s,color .15s}
  .btn-add-card:hover{border-color:var(--or);background:var(--bg3);color:var(--tx)}

  /* ADD COLUMN */
  .col-add-wrap{flex-shrink:0;width:280px;min-width:280px}
  .btn-add-col{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.15);color:#fff;font-size:13px;font-weight:600;transition:background .15s,border-color .15s}
  .btn-add-col:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.28)}
  .add-col-form{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:12px;display:none;flex-direction:column;gap:10px}
  .add-col-form.on{display:flex}
  .add-col-form input{background:var(--bg);border:1.5px solid var(--or);border-radius:7px;padding:10px 12px;color:#fff;font-size:13px;outline:none;width:100%}
  .add-col-form input::placeholder{color:var(--txd)}
  .acf-btns{display:flex;align-items:center;gap:8px}

  /* MODAL OVERLAY */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;justify-content:center;align-items:flex-start;padding:20px 12px 40px;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;width:100%;max-width:720px;display:flex;flex-direction:row}
  .m-main{flex:1;padding:20px;min-width:0}
  .m-side{width:220px;background:var(--bg3);border-left:1px solid var(--bd);padding:18px;flex-shrink:0;border-radius:0 14px 14px 0}
  .m-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px}
  .m-title{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
  .m-sub{font-size:11px;color:var(--txm);margin-top:3px;font-weight:600}
  .m-close{background:none;border:none;color:var(--txd);font-size:22px;cursor:pointer;margin-left:auto;line-height:1;padding:0 4px;flex-shrink:0}
  .m-close:hover{color:#fff}

  .sec-label{font-size:10px;font-weight:800;color:var(--txd);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}

  /* CHECKLIST */
  .checklist{display:flex;flex-direction:column;gap:2px}
  .check-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px}
  .check-row:hover{background:var(--bg3)}
  .check-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--or);cursor:pointer;flex-shrink:0}
  .item-text{flex:1;font-size:13px}
  .check-row.done .item-text{text-decoration:line-through;color:var(--txd)}
  .idlb{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;flex-shrink:0}
  .idlb.red{background:var(--reds);color:#e57373;border:1px solid var(--red)}
  .idlb.yel{background:var(--yels);color:#ffa726;border:1px solid var(--yel)}
  .idlb.grn{background:var(--grns);color:#66bb6a;border:1px solid var(--grn)}
  .btn-x{background:none;border:none;color:var(--txd);cursor:pointer;font-size:14px;padding:0 4px;opacity:0}
  .check-row:hover .btn-x{opacity:1}
  .btn-x:hover{color:#e57373}

  /* ADD TASK FORM */
  .add-wrap{margin-top:12px}
  .add-row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;cursor:pointer}
  .add-row:hover{background:var(--bg3)}
  .add-plus{width:22px;height:22px;background:var(--or);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700;flex-shrink:0}
  .add-row span{font-size:13px;color:var(--txm);font-weight:600}
  .add-form{display:none;flex-direction:column;gap:8px;padding:12px;background:var(--bg3);border-radius:8px;border:1px solid var(--bd);margin-top:8px}
  .add-form.on{display:flex}
  .add-form input[type=text]{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:9px 12px;color:#fff;font-size:13px;outline:none}
  .add-form input[type=text]:focus{border-color:var(--or)}
  .add-form input[type=text]::placeholder{color:var(--txd)}
  .form-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .dl-btn{position:relative;display:inline-flex;align-items:center;gap:5px;padding:7px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;color:var(--txm);font-size:12px;font-weight:600;cursor:pointer;user-select:none;transition:border-color .15s}
  .dl-btn:hover{border-color:var(--or);color:#fff}
  .dl-btn input[type=date]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
  .dl-btn.on{border-color:var(--or);color:var(--or)}

  .btn-ok{background:var(--or);border:none;color:#fff;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:.3px}
  .btn-ok:hover{background:var(--or2)}
  .btn-cancel{background:none;border:none;color:var(--txd);font-size:13px;cursor:pointer;padding:8px}
  .btn-cancel:hover{color:#fff}

  /* SIDE */
  .side-sec{margin-bottom:16px}
  .ppill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:4px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;margin-top:5px;word-break:break-word}
  .ppill.hot{background:var(--reds);color:#e57373;border:1px solid var(--red)}
  .ppill.warm{background:var(--yels);color:#ffa726;border:1px solid var(--yel)}
  .ppill.cust{background:var(--bg4);color:var(--txm);border:1px solid var(--bd)}
  .cd-btn{position:relative;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;color:var(--txm);font-size:12px;cursor:pointer;font-weight:600;margin-top:5px}
  .cd-btn:hover{border-color:var(--or)}
  .cd-btn input[type=date]{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
  .cd-btn.on{border-color:var(--or);color:var(--or)}
  .btn-side{display:flex;align-items:center;gap:6px;width:100%;padding:8px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;margin-top:8px;text-transform:uppercase;letter-spacing:.3px;border:1px solid}
  .btn-side.del{background:var(--reds);border-color:var(--red);color:#e57373}
  .btn-side.del:hover{background:rgba(192,57,43,.3)}
  .btn-side.ren{background:var(--bg4);border-color:var(--bd);color:var(--txm)}
  .btn-side.ren:hover{border-color:var(--or);color:#fff}
  .prog-label{font-size:11px;color:var(--txm);margin-bottom:5px;font-weight:600}

  /* COL TITLE EDIT INLINE */
  .col-title-input{background:transparent;border:none;border-bottom:1.5px solid var(--or);color:#fff;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;outline:none;width:100%;padding:1px 0}

  /* MINI DIALOG */
  .dlg-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:300;justify-content:center;align-items:center;padding:20px}
  .dlg-overlay.open{display:flex}
  .dlg{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:22px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px}
  .dlg h3{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
  .dlg input{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:10px 13px;color:#fff;font-size:13px;outline:none;width:100%}
  .dlg input:focus{border-color:var(--or)}
  .dlg-btns{display:flex;gap:8px;justify-content:flex-end}

  /* COL MENU */
  .col-menu{position:fixed;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:6px;z-index:50;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
  .col-menu-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--txm);white-space:nowrap}
  .col-menu-item:hover{background:var(--bg3);color:#fff}
  .col-menu-item.danger{color:#e57373}
  .col-menu-item.danger:hover{background:var(--reds)}

  /* TOAST */
  .toast{position:fixed;bottom:20px;right:16px;left:16px;max-width:340px;margin:0 auto;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--tx);z-index:500;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s;pointer-events:none}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.ok{border-color:var(--grn);color:#66bb6a}
  .toast.err{border-color:var(--red);color:#e57373}

  /* ── MOBILE ─────────────────────────────────────── */
  @media(max-width:680px){
    .board{flex-direction:column;padding:10px;gap:10px;overflow-x:hidden}
    .column{width:100%;min-width:0}
    .col-add-wrap{width:100%;min-width:0}
    .modal{flex-direction:column;max-width:100%}
    .m-side{width:100%;border-left:none;border-top:1px solid var(--bd);border-radius:0 0 14px 14px}
    .header-date{display:none}
    .overlay{padding:12px 8px 30px}
    .toast{bottom:14px;right:12px;left:12px}
  }
</style>
</head>
<body>

<div class="header">
  <div style="line-height:1.2">
    <div><span class="logo-yart">YART</span><span class="logo-dot"></span></div>
    <div class="logo-prod">PROD</div>
  </div>
  <div class="header-sep"></div>
  <button id="btnReset" style="background:none;border:1px solid var(--bd);color:var(--txm);font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer;margin-right:10px">⟳ Сбросить к стандартному набору</button>
  <div class="header-sync" id="headerSync">синхронизация…</div>
  <div class="header-date" id="headerDate"></div>
</div>

<div class="board" id="board"></div>

<!-- MODAL: CARD DETAIL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="m-main">
      <div class="m-header">
        <div><div class="m-title" id="mTitle"></div><div class="m-sub" id="mSub"></div></div>
        <button class="m-close" id="btnClose">✕</button>
      </div>
      <div id="mProgress" style="margin-bottom:16px"></div>
      <div class="sec-label">Задачи</div>
      <div class="checklist" id="mChecklist"></div>
      <div class="add-wrap">
        <div class="add-row" id="btnShowForm">
          <div class="add-plus">+</div><span>Добавить задачу</span>
        </div>
        <div class="add-form" id="addForm">
          <input type="text" id="newText" placeholder="Название задачи...">
          <div class="form-row">
            <label class="dl-btn" id="dlBtn"><span>⏱</span><span id="dlLabel">Срок</span><input type="date" id="newDate"></label>
            <button class="btn-ok" id="btnAdd">Добавить</button>
            <button class="btn-cancel" id="btnHide">Отмена</button>
          </div>
        </div>
      </div>
    </div>
    <div class="m-side">
      <div class="side-sec">
        <div class="sec-label">Колонка</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:5px">
          <div class="avatar" id="sAv" style="width:26px;height:26px;font-size:11px"></div>
          <span id="sName" style="font-size:13px;font-weight:700"></span>
        </div>
      </div>
      <div class="side-sec">
        <div class="sec-label">Карточка</div>
        <div id="sPrio"></div>
      </div>
      <div class="side-sec">
        <div class="sec-label">Дедлайн</div>
        <label class="cd-btn" id="cdBtn"><span>⏱</span><span id="cdLabel">Выбрать дату</span><input type="date" id="cdInput"></label>
      </div>
      <button class="btn-side ren" id="btnRename">✏️ Переименовать</button>
      <button class="btn-side del" id="btnDelCard">🗑 Удалить карточку</button>
    </div>
  </div>
</div>

<!-- MINI DIALOG -->
<div class="dlg-overlay" id="dlgOverlay">
  <div class="dlg">
    <h3 id="dlgTitle"></h3>
    <input type="text" id="dlgInput" placeholder="">
    <div class="dlg-btns">
      <button class="btn-cancel" id="dlgCancel">Отмена</button>
      <button class="btn-ok" id="dlgOk">Создать</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG: ОБЛАЧНОЕ ХРАНИЛИЩЕ (Cloudflare Worker + KV) ─────────────────────
const CF_URL = "https://little-base-9ae1.hellboytvcuka.workers.dev/";
const CF_KEY = "jxEGma9N6uGjstWWZ9fGyBWKUninLD4isctDKggv";

// Уведомления в Telegram теперь шлёт ОТДЕЛЬНЫЙ скрипт на GitHub (как было с Trello) —
// он проверяет это же облачное хранилище по расписанию. В самом сайте кода
// для отправки в Telegram больше нет (токен бота нельзя хранить в открытой странице).

const PALETTE = ["#f05a1a","#1a7af0","#1ab87a","#9b1af0","#e01aaa","#f0b01a","#1ae0d0","#e04040"];
const MEMBER_COLORS = {
  "Артём":"#f05a1a","Линар":"#1a7af0","Саша":"#1ab87a",
  "Никита":"#9b1af0","Эмилия":"#e01aaa","Макс":"#f0b01a"
};
const MONTHS = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

// ── STATE ────────────────────────────────────────────────────────────────────
let state = null;
let cur = null;
let dlgMode = null, dlgColId = null;

function buildDefault() {
  const members = ["Артём","Линар","Саша","Никита","Эмилия","Макс"];
  return {
    cols: members.map(m => ({
      id: uid(), name: m,
      color: MEMBER_COLORS[m] || PALETTE[0],
      cards: [
        {id:uid(), title:"срочно и важно",    deadline:"", items:[]},
        {id:uid(), title:"важно но не срочно", deadline:"", items:[]}
      ]
    }))
  };
}

// Читаем облачное хранилище. Если оно ещё пустое — создаём в нём доску по умолчанию.
async function loadState() {
  try {
    const r = await fetch(CF_URL, { headers: { "X-Api-Key": CF_KEY } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const record = await r.json();
    setSync(true);
    if (record && Array.isArray(record.cols) && record.cols.length > 0) {
      try { localStorage.setItem("yp7_cache", JSON.stringify(record)); } catch(e){}
      return record;
    }
    const fresh = buildDefault();
    await saveState(fresh);
    return fresh;
  } catch (e) {
    setSync(false);
    // Офлайн-заглушка: показываем последнюю известную копию, чтобы страница не была пустой.
    try {
      const cached = localStorage.getItem("yp7_cache");
      if (cached) return JSON.parse(cached);
    } catch(e2) {}
    return buildDefault();
  }
}

async function saveState(s) {
  try {
    const r = await fetch(CF_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Api-Key": CF_KEY },
      body: JSON.stringify(s)
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    setSync(true);
    try { localStorage.setItem("yp7_cache", JSON.stringify(s)); } catch(e){}
  } catch (e) {
    setSync(false);
    showToast("⚠️ Не удалось сохранить в облако — проверь интернет", "err");
  }
}

// Сохранения идут строго по очереди (одно за другим), а не параллельно.
// Раньше при быстром добавлении нескольких задач подряд уходило сразу
// несколько запросов в облако одновременно, и если ответ на более РАННИЙ
// запрос приходил ПОЗЖЕ более нового — он затирал уже сохранённые данные,
// и часть задач "терялась". Теперь каждый следующий save ждёт, пока
// закончится предыдущий, и всегда отправляет самое актуальное состояние.
let _saveChain = Promise.resolve();
function save() {
  _saveChain = _saveChain.then(() => saveState(state)).catch(() => {});
  return _saveChain;
}

function setSync(ok) {
  const el = document.getElementById("headerSync");
  if (!el) return;
  el.textContent = ok ? "✓ синхронизировано" : "⚠️ офлайн";
  el.className = "header-sync" + (ok ? "" : " err");
}

function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function fmtDate(s) {
  if(!s) return "";
  const d = new Date(s+"T00:00:00");
  return d.getDate()+" "+MONTHS[d.getMonth()];
}
function dlInfo(s) {
  const d = new Date(s+"T00:00:00"), t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((d-t)/86400000);
  return {cls:diff<0?"red":diff<=2?"yel":"grn", label:fmtDate(s), diff};
}
function dotCls(t) {
  t=t.toLowerCase();
  if(t.includes("срочно")&&t.includes("важно")) return "red";
  if(t.includes("важно")) return "yel";
  return "or";
}
function pilCls(t) {
  t=t.toLowerCase();
  if(t.includes("срочно")&&t.includes("важно")) return "hot";
  if(t.includes("важно")) return "warm";
  return "cust";
}
function getCol(id) { return state.cols.find(c=>c.id===id); }
function getCard(colId,cardId) { const c=getCol(colId); return c&&c.cards.find(x=>x.id===cardId); }

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTm;
function showToast(msg,type=""){
  const el=document.getElementById("toast");
  el.textContent=msg; el.className="toast "+type+" show";
  clearTimeout(toastTm); toastTm=setTimeout(()=>el.classList.remove("show"),3500);
}

// ── COL MENU ──────────────────────────────────────────────────────────────────
let openMenuEl=null;
function closeMenu(){if(openMenuEl){openMenuEl.remove();openMenuEl=null;}}
function openColMenu(e,colId){
  e.stopPropagation(); closeMenu();
  const menu=document.createElement("div"); menu.className="col-menu";
  menu.style.cssText=`top:${Math.min(e.clientY+4,window.innerHeight-120)}px;left:${Math.min(e.clientX-160,window.innerWidth-200)}px;`;
  menu.innerHTML=`
    <div class="col-menu-item" data-a="ren">✏️ Переименовать колонку</div>
    <div class="col-menu-item danger" data-a="del">🗑 Удалить колонку</div>`;
  document.body.appendChild(menu); openMenuEl=menu;
  menu.querySelector("[data-a=ren]").addEventListener("click",()=>{closeMenu();openColRenameDialog(colId);});
  menu.querySelector("[data-a=del]").addEventListener("click",()=>{closeMenu();deleteColumn(colId);});
}
document.addEventListener("click",()=>closeMenu());

// ── RENDER ─────────────────────────────────────────────────────────────────────
function render(){
  const board=document.getElementById("board");
  board.innerHTML="";
  state.cols.forEach(col=>board.appendChild(mkCol(col)));
  board.appendChild(mkAddColWrap());
  const now=new Date();
  document.getElementById("headerDate").textContent=
    now.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
}

function mkCol(col){
  const el=document.createElement("div"); el.className="column";
  const active=col.cards.reduce((n,c)=>n+c.items.filter(i=>!i.done).length,0);
  const color=col.color||"#f05a1a";

  const hdr=document.createElement("div"); hdr.className="col-header";

  const av=document.createElement("div"); av.className="avatar";
  av.style.cssText=`width:32px;height:32px;font-size:13px;background:${color}22;color:${color};border:1.5px solid ${color}55`;
  av.textContent=col.name[0].toUpperCase();

  const title=document.createElement("span"); title.className="col-title-text";
  title.textContent=col.name; title.title="Нажмите для переименования";
  title.addEventListener("click",()=>startInlineRename(col.id,title));

  const menuBtn=document.createElement("button"); menuBtn.className="btn-col-menu";
  menuBtn.innerHTML="···"; menuBtn.title="Меню";
  menuBtn.addEventListener("click",(e)=>openColMenu(e,col.id));

  hdr.appendChild(av); hdr.appendChild(title);
  if(active){const cnt=document.createElement("span");cnt.className="col-count";cnt.textContent=active;hdr.appendChild(cnt);}
  hdr.appendChild(menuBtn);
  el.appendChild(hdr);

  col.cards.forEach(card=>el.appendChild(mkCard(col.id,card)));

  const addBtn=document.createElement("div"); addBtn.className="btn-add-card";
  addBtn.innerHTML=`<span style="font-size:15px;font-weight:700">+</span><span>Добавить карточку</span>`;
  addBtn.addEventListener("click",()=>openNewCardDialog(col.id));
  el.appendChild(addBtn);
  return el;
}

function mkCard(colId,card){
  const el=document.createElement("div"); el.className="card";
  const items=card.items||[];
  const done=items.filter(i=>i.done).length, total=items.length;
  const pct=total?Math.round(done/total*100):0;
  const pf=pct<50?"#c0392b":pct<80?"#cc8800":"#f05a1a";
  let db=card.deadline?(()=>{const{cls,label}=dlInfo(card.deadline);return`<span class="badge b-${cls}">⏱ ${label}</span>`;})():"";
  const tb=total?`<span class="badge b-def">☑ ${done}/${total}</span>`:"";
  const prg=total?`<div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${pf}"></div></div>`:"";
  el.innerHTML=`<div class="card-label"><div class="card-dot ${dotCls(card.title)}"></div><span class="card-name">${card.title}</span></div><div class="card-meta">${tb}${db}</div>${prg}`;
  el.addEventListener("click",()=>openModal(colId,card.id));
  return el;
}

function mkAddColWrap(){
  const wrap=document.createElement("div"); wrap.className="col-add-wrap";
  const btn=document.createElement("div"); btn.className="btn-add-col";
  btn.innerHTML=`<span style="font-size:20px;font-weight:300">+</span><span>Добавить колонку</span>`;
  const form=document.createElement("div"); form.className="add-col-form";
  form.innerHTML=`<input type="text" id="newColName" placeholder="Введите имя колонки...">
    <div class="acf-btns"><button class="btn-ok" id="btnAddCol">Добавить список</button><button class="btn-cancel" id="btnCancelCol" style="font-size:20px;padding:2px 10px">✕</button></div>`;
  btn.addEventListener("click",()=>{btn.style.display="none";form.classList.add("on");setTimeout(()=>document.getElementById("newColName").focus(),50);});
  form.querySelector("#btnCancelCol").addEventListener("click",()=>{form.classList.remove("on");btn.style.display="flex";});
  form.querySelector("#btnAddCol").addEventListener("click",()=>{
    const name=document.getElementById("newColName").value.trim(); if(!name)return;
    state.cols.push({id:uid(),name,color:PALETTE[state.cols.length%PALETTE.length],cards:[{id:uid(),title:"задачи",deadline:"",items:[]}]});
    save();render();
  });
  form.querySelector("#newColName").addEventListener("keydown",e=>{
    if(e.key==="Enter")form.querySelector("#btnAddCol").click();
    if(e.key==="Escape")form.querySelector("#btnCancelCol").click();
  });
  wrap.appendChild(btn); wrap.appendChild(form);
  return wrap;
}

// ── INLINE COL RENAME ─────────────────────────────────────────────────────────
function startInlineRename(colId,titleEl){
  const col=getCol(colId); if(!col)return;
  const inp=document.createElement("input"); inp.className="col-title-input"; inp.value=col.name;
  titleEl.replaceWith(inp); inp.focus(); inp.select();
  function done(){
    const v=inp.value.trim()||col.name; col.name=v; save(); render();
  }
  inp.addEventListener("blur",done);
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();done();}if(e.key==="Escape")render();});
}

function deleteColumn(colId){
  const col=getCol(colId); if(!col)return;
  if(!confirm(`Удалить колонку «${col.name}» и все карточки?`))return;
  state.cols=state.cols.filter(c=>c.id!==colId); save(); render();
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function openModal(colId,cardId){
  const col=getCol(colId), card=getCard(colId,cardId);
  if(!col||!card)return;
  cur={colId,cardId};
  document.getElementById("mTitle").textContent=card.title.toUpperCase();
  document.getElementById("mSub").textContent=col.name;
  const color=col.color||"#f05a1a";
  const av=document.getElementById("sAv");
  av.style.cssText=`width:26px;height:26px;font-size:11px;background:${color}22;color:${color};border:1.5px solid ${color}55;border-radius:6px`;
  av.textContent=col.name[0].toUpperCase();
  document.getElementById("sName").textContent=col.name;
  document.getElementById("sPrio").innerHTML=`<div class="ppill ${pilCls(card.title)}">${card.title}</div>`;
  const cdInput=document.getElementById("cdInput");
  cdInput.value=card.deadline||"";
  document.getElementById("cdLabel").textContent=card.deadline?fmtDate(card.deadline):"Выбрать дату";
  document.getElementById("cdBtn").classList.toggle("on",!!card.deadline);
  renderChecklist(card.items||[]);
  renderProgress(card.items||[]);
  hideForm();
  document.getElementById("overlay").classList.add("open");
}

function closeModal(){document.getElementById("overlay").classList.remove("open");cur=null;}

function renderChecklist(items){
  const list=document.getElementById("mChecklist"); list.innerHTML="";
  items.forEach((item,idx)=>{
    const row=document.createElement("div");
    row.className="check-row"+(item.done?" done":"");
    let db=item.deadline?(()=>{const{cls,label}=dlInfo(item.deadline);return`<span class="idlb ${cls}">⏱ ${label}</span>`;})():"";
    row.innerHTML=`<input type="checkbox" ${item.done?"checked":""}><span class="item-text">${item.text}</span>${db}<button class="btn-x">✕</button>`;
    row.querySelector("input").addEventListener("change",()=>{
      getCard(cur.colId,cur.cardId).items[idx].done^=true;
      save();render();const c=getCard(cur.colId,cur.cardId);renderChecklist(c.items);renderProgress(c.items);
    });
    row.querySelector(".btn-x").addEventListener("click",(e)=>{
      e.stopPropagation();
      getCard(cur.colId,cur.cardId).items.splice(idx,1);
      save();render();const c=getCard(cur.colId,cur.cardId);renderChecklist(c.items);renderProgress(c.items);
    });
    list.appendChild(row);
  });
}

function renderProgress(items){
  const wrap=document.getElementById("mProgress");
  if(!items.length){wrap.innerHTML="";return;}
  const done=items.filter(i=>i.done).length, pct=Math.round(done/items.length*100);
  const pf=pct<50?"#c0392b":pct<80?"#cc8800":"#f05a1a";
  wrap.innerHTML=`<div class="prog-label">${pct}% — ${done} из ${items.length}</div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${pf}"></div></div>`;
}

// ── ADD TASK ──────────────────────────────────────────────────────────────────
function showForm(){document.getElementById("addForm").classList.add("on");document.getElementById("newText").focus();}
function hideForm(){
  document.getElementById("addForm").classList.remove("on");
  document.getElementById("newText").value="";
  document.getElementById("newDate").value="";
  document.getElementById("dlLabel").textContent="Срок";
  document.getElementById("dlBtn").classList.remove("on");
}
async function addItem(){
  const text=document.getElementById("newText").value.trim();
  if(!text){document.getElementById("newText").focus();return;}
  const deadline=document.getElementById("newDate").value;
  const card=getCard(cur.colId,cur.cardId); if(!card)return;
  // id нужен, чтобы бот-уведомлятор на GitHub мог отличать задачи друг от друга.
  card.items.push({id:uid(),text,deadline,done:false});
  save();render();renderChecklist(card.items);renderProgress(card.items);
  hideForm();showForm();
}

// ── DIALOGS ───────────────────────────────────────────────────────────────────
function openNewCardDialog(colId){
  dlgMode="newcard";dlgColId=colId;
  document.getElementById("dlgTitle").textContent="Новая карточка";
  document.getElementById("dlgOk").textContent="Создать";
  document.getElementById("dlgInput").value="";
  document.getElementById("dlgInput").placeholder="Название карточки...";
  document.getElementById("dlgOverlay").classList.add("open");
  setTimeout(()=>document.getElementById("dlgInput").focus(),50);
}
function openColRenameDialog(colId){
  dlgMode="renamecol";dlgColId=colId;
  const col=getCol(colId);
  document.getElementById("dlgTitle").textContent="Переименовать колонку";
  document.getElementById("dlgOk").textContent="Сохранить";
  document.getElementById("dlgInput").value=col?col.name:"";
  document.getElementById("dlgInput").placeholder="Имя колонки...";
  document.getElementById("dlgOverlay").classList.add("open");
  setTimeout(()=>{const i=document.getElementById("dlgInput");i.focus();i.select();},50);
}
function closeDlg(){document.getElementById("dlgOverlay").classList.remove("open");}
function confirmDlg(){
  const val=document.getElementById("dlgInput").value.trim(); if(!val)return;
  if(dlgMode==="newcard"){
    const col=getCol(dlgColId);
    if(col){col.cards.push({id:uid(),title:val,deadline:"",items:[]});save();render();}
  } else if(dlgMode==="renamecol"){
    const col=getCol(dlgColId);
    if(col){col.name=val;save();render();}
  } else if(dlgMode==="renamecard"){
    const card=getCard(cur.colId,cur.cardId);
    if(card){card.title=val;save();render();openModal(cur.colId,cur.cardId);}
  }
  closeDlg();
}

// ── WIRE EVENTS ───────────────────────────────────────────────────────────────
document.getElementById("btnClose").addEventListener("click",closeModal);
document.getElementById("overlay").addEventListener("click",e=>{if(e.target===document.getElementById("overlay"))closeModal();});
document.getElementById("btnShowForm").addEventListener("click",showForm);
document.getElementById("btnHide").addEventListener("click",hideForm);
document.getElementById("btnAdd").addEventListener("click",addItem);
document.getElementById("newText").addEventListener("keydown",e=>{if(e.key==="Enter")addItem();});
document.getElementById("newDate").addEventListener("input",()=>{
  const v=document.getElementById("newDate").value;
  document.getElementById("dlLabel").textContent=v?fmtDate(v):"Срок";
  document.getElementById("dlBtn").classList.toggle("on",!!v);
});
// Невидимое поле даты иногда "не ловит" клик мышкой (баг браузера).
// Подстраховка: если клик пришёлся мимо самого поля — открываем календарь кодом.
document.getElementById("dlBtn").addEventListener("click",(e)=>{
  if(e.target.tagName==="INPUT")return;
  e.preventDefault();
  try{document.getElementById("newDate").showPicker();}catch(err){document.getElementById("newDate").focus();}
});
document.getElementById("cdInput").addEventListener("input",()=>{
  const v=document.getElementById("cdInput").value;
  const card=getCard(cur.colId,cur.cardId); if(!card)return;
  card.deadline=v;
  document.getElementById("cdLabel").textContent=v?fmtDate(v):"Выбрать дату";
  document.getElementById("cdBtn").classList.toggle("on",!!v);
  save();render();
});
// Та же подстраховка для кнопки срока карточки в боковой панели.
document.getElementById("cdBtn").addEventListener("click",(e)=>{
  if(e.target.tagName==="INPUT")return;
  e.preventDefault();
  try{document.getElementById("cdInput").showPicker();}catch(err){document.getElementById("cdInput").focus();}
});
document.getElementById("btnRename").addEventListener("click",()=>{
  if(!cur)return;
  const card=getCard(cur.colId,cur.cardId); if(!card)return;
  dlgMode="renamecard";dlgColId=cur.colId;
  document.getElementById("dlgTitle").textContent="Переименовать карточку";
  document.getElementById("dlgOk").textContent="Сохранить";
  document.getElementById("dlgInput").value=card.title;
  document.getElementById("dlgInput").placeholder="Название...";
  document.getElementById("dlgOverlay").classList.add("open");
  setTimeout(()=>{const i=document.getElementById("dlgInput");i.focus();i.select();},50);
});
document.getElementById("btnDelCard").addEventListener("click",()=>{
  if(!confirm("Удалить карточку и все задачи?"))return;
  const col=getCol(cur.colId); if(!col)return;
  col.cards=col.cards.filter(c=>c.id!==cur.cardId);
  save();closeModal();render();
});
document.getElementById("dlgOk").addEventListener("click",confirmDlg);
document.getElementById("dlgCancel").addEventListener("click",closeDlg);
document.getElementById("dlgOverlay").addEventListener("click",e=>{if(e.target===document.getElementById("dlgOverlay"))closeDlg();});
document.getElementById("dlgInput").addEventListener("keydown",e=>{
  if(e.key==="Enter")confirmDlg();
  if(e.key==="Escape")closeDlg();
});

// ── ОПРОС ОБЛАКА (чтобы у всех обновлялась доска, если кто-то другой её поменял) ─
setInterval(async ()=>{
  if(document.getElementById("overlay").classList.contains("open"))return; // не дёргаем, пока открыта карточка
  if(document.hidden)return; // не дёргаем облако, пока вкладка свёрнута/неактивна — экономим лимит запросов
  const fresh = await loadState();
  state = fresh; render();
}, 15000); // раз в 15 секунд: Cloudflare даёт 100 000 бесплатных запросов КАЖДЫЙ день, лимит не проблема

document.getElementById("btnReset").addEventListener("click", async ()=>{
  if(!confirm("Стереть текущую доску и создать заново колонки: Артём, Линар, Саша, Никита, Эмилия, Макс?"))return;
  state = buildDefault();
  await saveState(state);
  render();
});

// ── СТАРТ ─────────────────────────────────────────────────────────────────────
async function init(){
  state = await loadState();
  render();
}
init();
</script>
</body>
